[project]
name = "scinapse"
version = "0.1.0"
description = "Generate a research-paper discovery graph (JSON) from seed papers"
readme = "readme.md"
authors = [
    { name = "nonvisual", email = "nonvisual.wrk@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "scikit-learn>=1.5",
]

[project.scripts]
scinapse = "scinapse.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
