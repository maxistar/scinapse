server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes routes /api to the backend Service. Do not proxy to a
    # hard-coded host from this image; return a clear miss if routed directly.
    location ^~ /api/ {
        try_files $uri =404;
    }

    # Vite's client-side routes must resolve to the application shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
